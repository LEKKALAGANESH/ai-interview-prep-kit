# Backend on Render (free web service). Frontend: import /client into Vercel (root directory: client).
services:
  - type: web
    name: ai-interview-prep-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # the Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false # free MongoDB Atlas cluster; without it kits live on ephemeral disk
